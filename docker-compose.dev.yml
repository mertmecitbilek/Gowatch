services:
  gowatch-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: gowatch-dev
    ports:
      - "8080:8080"
    volumes:
      - .:/app
    environment:
      - PORT=8080
      - GIN_MODE=debug
      - TZ=Europe/Istanbul
      - SESSION_SECRET=change-this-to-a-strong-random-secret
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=admin123
