services:
  gowatch:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gowatch
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # SQLite veritabanını local'de sakla (container silinse bile veri kalır)
      - ./data:/app/data
    environment:
      - PORT=8080
      - GIN_MODE=release
      - TZ=Europe/Istanbul
      # SESSION_SECRET verilmezse rastgele üretilip ./data/session.key dosyasına kaydedilir
      # - SESSION_SECRET=
      - ADMIN_USERNAME=admin
      # ADMIN_PASSWORD verilmezse ilk açılışta rastgele üretilir ve loglarda bir kez gösterilir:
      #   docker compose logs gowatch | grep "admin password"
      # - ADMIN_PASSWORD=
      # HTTPS arkasında çalışıyorsa çerezleri yalnızca HTTPS üzerinden gönder
      # - COOKIE_SECURE=true
      # Reverse proxy (nginx, traefik vb.) kullanılıyorsa IP'si/ağı
      # - TRUSTED_PROXIES=172.16.0.0/12
      # Yerel ağdaki (192.168.x.x, 10.x.x.x, localhost) servisleri izlemek için
      # - ALLOW_PRIVATE_TARGETS=true
      # Email bildirimleri için (opsiyonel)
      # - SMTP_HOST=smtp.gmail.com
      # - SMTP_PORT=587
      # - SMTP_USERNAME=your@gmail.com
      # - SMTP_PASSWORD=your-app-password
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/login"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
