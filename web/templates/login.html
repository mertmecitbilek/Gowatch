<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.title}}</title>
    <meta name="description" content="GoWatch — Login to your monitoring dashboard">
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="login-body">
    <div class="login-container">
        <div class="login-card">
            <div class="login-logo">
                <div class="logo-icon">
                    <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
                        <circle cx="20" cy="20" r="18" stroke="url(#grad1)" stroke-width="2.5"/>
                        <circle cx="20" cy="20" r="4" fill="url(#grad1)"/>
                        <path d="M20 8 L20 13" stroke="url(#grad1)" stroke-width="2" stroke-linecap="round"/>
                        <path d="M20 27 L20 32" stroke="url(#grad1)" stroke-width="2" stroke-linecap="round"/>
                        <path d="M8 20 L13 20" stroke="url(#grad1)" stroke-width="2" stroke-linecap="round"/>
                        <path d="M27 20 L32 20" stroke="url(#grad1)" stroke-width="2" stroke-linecap="round"/>
                        <defs>
                            <linearGradient id="grad1" x1="0" y1="0" x2="40" y2="40">
                                <stop offset="0%" stop-color="#6366f1"/>
                                <stop offset="100%" stop-color="#8b5cf6"/>
                            </linearGradient>
                        </defs>
                    </svg>
                </div>
                <h1 class="logo-text">GoWatch</h1>
            </div>
            <p class="login-subtitle">Web Monitoring Dashboard</p>

            {{if .error}}
            <div class="alert alert-error">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
                </svg>
                {{.error}}
            </div>
            {{end}}

            <form method="POST" action="/login" class="login-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
                        </svg>
                        <input type="text" id="username" name="username" placeholder="Enter Your Username" required autocomplete="username">
                    </div>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                        </svg>
                        <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
                    </div>
                </div>
                <button type="submit" class="btn btn-primary btn-full" id="login-btn">
                    Sign In
                </button>
            </form>

            <div class="login-divider">
                <span>Don't have an account?</span>
            </div>
            <a href="/register" class="btn btn-secondary btn-full">Create Account</a>
        </div>
        <p class="login-footer">GoWatch v1.0 · Open Source Monitoring</p>
    </div>
</body>
</html>
